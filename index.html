<head>

<title>Paulo Lima - Coordenador Comercial Imobiliário - CRECI 30394</title>
<style>
  :root {
    color-scheme: dark;
    --fundo: #000;
    --linha: #3a2f12;
    --ouro: #d4a63a;
    --ouro-claro: #f0cf75;
    --prata: #c9c9c9;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--fundo);
    color: #f2f2f2;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 360px;
    width: 100%;
    text-align: center;
    background: var(--fundo);
    border-radius: 20px;
    padding: 12px 24px 28px;
    border: 1px solid var(--linha);
    box-shadow: 0 0 0 1px rgba(212,166,58,.08), 0 10px 40px rgba(212,166,58,.08);
  }
  .logo { display: block; width: 100%; height: auto; margin-bottom: 4px; }
  h1 { font-size: 24px; font-weight: 600; color: var(--ouro-claro); letter-spacing: .02em; margin-bottom: 4px; }
  .subtitulo { font-size: 14px; color: var(--prata); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 26px; }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    margin-top: 10px;
  }
  .btn.principal {
    background: linear-gradient(180deg, var(--ouro-claro), var(--ouro));
    color: #1a1305;
  }
  .btn.secundario { border: 1px solid var(--ouro); color: var(--ouro-claro); }
  .btn:hover { filter: brightness(1.1); }
  .btn:focus-visible { outline: 2px solid var(--ouro-claro); outline-offset: 2px; }
</style>
</head>
